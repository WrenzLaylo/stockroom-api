name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockroom_test
          POSTGRES_USER: stockroom_test
          POSTGRES_PASSWORD: stockroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco
      # The deploy workflow ships THIS jar, the one the tests just passed on. It is never rebuilt.
      - name: Upload application jar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/stockroom-api.jar
          retention-days: 14
